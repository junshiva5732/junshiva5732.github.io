<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아쇼핑</title>
<meta name="description" content="모아쇼핑 쇼츠에 나온 상품 모음. 영상 끝에 나온 번호를 찾아 누르세요.">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e24; --muted:#5b6070; --line:#e3e6ee; --accent:#ff5a3c; --no:#1c1e24; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e26; --text:#e8eaf0; --muted:#a0a6b6; --line:#2a2e3a; --accent:#ff6e52; --no:#e8eaf0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  header h1 { font-size:1.4rem; margin:8px 0 4px; }
  header p { margin:0; color:var(--muted); font-size:.95rem; }
  .ad { font-size:.8rem; color:var(--muted); background:var(--card); border:1px solid var(--line);
         border-radius:10px; padding:8px 10px; margin:12px 0; }
  .find { display:flex; gap:8px; margin:12px 0 16px; }
  .find input { flex:1; font-size:1.1rem; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
                 background:var(--card); color:var(--text); }
  .find button { font-size:1rem; padding:10px 16px; border:0; border-radius:10px; background:var(--no); color:var(--bg); }
  .item { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
           border-radius:16px; padding:12px; margin-bottom:12px; scroll-margin-top:16px; }
  .item:target { outline:3px solid var(--accent); }
  .no { flex:none; width:48px; height:48px; border-radius:50%; background:var(--no); color:var(--bg);
         font-weight:800; font-size:1.3rem; display:flex; align-items:center; justify-content:center; }
  .item img { flex:none; width:88px; height:88px; object-fit:contain; background:#fff; border-radius:10px; }
  .info { min-width:0; flex:1; }
  .info h2 { font-size:1rem; margin:0 0 4px; line-height:1.35; }
  .price { margin:0 0 8px; font-weight:700; }
  .off { color:var(--accent); font-weight:700; font-size:.9rem; }
  .buy { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:700;
          padding:8px 14px; border-radius:10px; }
  footer { color:var(--muted); font-size:.8rem; padding:8px 0 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>모아쇼핑</h1>
    <p>영상 끝에 나온 <b>번호</b>를 찾아 '쿠팡에서 보기'를 누르세요.</p>
  </header>
  <div class="ad">이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
  <form class="find" onsubmit="location.hash=this.n.value.trim();return false">
    <input name="n" type="number" inputmode="numeric" min="1" placeholder="번호로 찾기">
    <button>찾기</button>
  </form>

  <article class="item" id="1">
    <div class="no">1</div>
    <img src="img/1.jpg" alt="동국제약 굿잠 스팀안대" loading="lazy">
    <div class="info">
      <h2>동국제약 굿잠 스팀안대</h2>
      <p class="price">7,760원 <span class="off">61% 할인</span></p>
      <a class="buy" href="https://link.coupang.com/a/hWzT2eeLAa" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
    </div>
  </article>
  <footer>※ 가격은 영상 제작일 기준이며 바뀔 수 있어요</footer>
</div>
</body>
</html>
